<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raoine & Aboudé — Save the Date</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400;1,600&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#EFE9DF;font-family:'Cormorant Garamond',serif;}

/* Linen texture */
body::before{content:'';position:fixed;inset:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(140,120,80,.025) 3px,rgba(140,120,80,.025) 4px),
    repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(140,120,80,.025) 3px,rgba(140,120,80,.025) 4px);
  pointer-events:none;z-index:0;}

.scene{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:1;}

/* FRAME — shows one image at a time, same envelope frame */
.frame{
  position:relative;
  width:min(420px,85vw);
  border-radius:4px;
  box-shadow:0 30px 70px rgba(26,20,16,.2),0 8px 20px rgba(26,20,16,.1);
  overflow:hidden;
  cursor:pointer;
}
.frame img{width:100%;display:block;transition:opacity .6s ease;position:absolute;top:0;left:0;}
.frame img.active{position:relative;opacity:1;}
.frame img.hidden{opacity:0;pointer-events:none;}

/* Hint overlay */
.hint{
  position:absolute;inset:0;
  display:flex;align-items:flex-end;justify-content:center;
  padding-bottom:1.5rem;
  z-index:10;pointer-events:none;
}
.hint span{
  font-style:italic;font-size:.82rem;color:#3A3020;
  background:rgba(239,233,223,.85);
  padding:.4rem 1.1rem;border-radius:50px;
  animation:blink 2.5s ease-in-out infinite;
  box-shadow:0 2px 8px rgba(26,20,16,.1);
}
@keyframes blink{0%,100%{opacity:.7;}50%{opacity:1;}}

/* Slide transition */
.slide-wrap{position:relative;width:min(420px,85vw);}
.slide{position:absolute;width:100%;transition:transform .9s cubic-bezier(.4,0,.2,1),opacity .7s ease;}
.slide.current{position:relative;transform:translateY(0);opacity:1;}
.slide.above{transform:translateY(-110%);opacity:0;}
.slide.below{transform:translateY(110%);opacity:0;}

/* CTA */
.cta{position:fixed;bottom:1.8rem;left:50%;transform:translateX(-50%) translateY(16px);
  z-index:100;opacity:0;transition:opacity .8s ease,transform .8s ease;text-align:center;pointer-events:none;}
.cta.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
.cta a{display:inline-flex;align-items:center;gap:.6rem;background:#1A1410;color:#F8F3E8;
  font-family:'Cinzel',serif;font-size:.66rem;letter-spacing:.22em;text-transform:uppercase;
  padding:.9rem 1.9rem;border-radius:50px;text-decoration:none;
  box-shadow:0 8px 26px rgba(26,20,16,.26);transition:all .25s;}
.cta a:hover{background:#3A3020;transform:translateY(-2px);}
.cta p{font-style:italic;font-size:.78rem;color:#3A3020;opacity:.5;margin-top:.4rem;}

/* Dots */
.dots{position:fixed;top:1.4rem;left:50%;transform:translateX(-50%);display:flex;gap:.4rem;z-index:100;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(26,20,16,.16);transition:all .4s;}
.dot.on{background:#1A1410;width:18px;border-radius:3px;}

/* Confetti */
.conf{position:fixed;inset:0;pointer-events:none;z-index:200;overflow:hidden;}
.petal{position:absolute;top:-14px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;opacity:0;animation:drop linear forwards;}
@keyframes drop{0%{opacity:1;}85%{opacity:.8;}100%{transform:translateX(var(--d)) translateY(105vh) rotate(var(--r));opacity:0;}}
</style>
</head>

<div class="cta" id="cta">
  <a href="index.html">💌 &nbsp;Confirmer ma présence</a>
  <p>Répondre à l'invitation</p>
</div>

<style>
@keyframes fadeIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
</style>

<script>
let s=0;
// Touch/swipe
let touchStartX=0, touchStartY=0;

function dots(){[0,1,2].forEach(i=>document.getElementById('d'+i).classList.toggle('on',i===s));}

function goTo(n){
  if(n===1 && s===0) go1();
  else if(n===2 && s===1) go2();
  else if(n===0 && s>0) goBack();
}
function goNext(){ goTo(s+1); }
function goBack(){
  if(s===0) return;
  const prev=s-1; 
  // hide current
  const cur=document.getElementById('s'+s);
  cur.style.animation='fadeOut .4s ease forwards';
  setTimeout(()=>{
    cur.style.display='none';
    cur.style.animation='';
    s=prev; dots();
    const prevEl=document.getElementById('s'+s);
    prevEl.style.display='block';
    prevEl.style.animation='fadeIn .5s ease';
    if(s<2) document.getElementById('cta').classList.remove('show');
  },400);
}

function go1(){
  if(s!==0)return; s=1; dots();
  confetti();
  document.getElementById('s0').style.animation='fadeOut .5s ease forwards';
  setTimeout(()=>{
    document.getElementById('s0').style.display='none';
    document.getElementById('s1').style.display='block';
    document.getElementById('s1').style.animation='fadeIn .5s ease';
  },500);
}

function go2(){
  if(s!==1)return; s=2; dots();
  document.getElementById('s1').style.animation='fadeOut .5s ease forwards';
  setTimeout(()=>{
    document.getElementById('s1').style.display='none';
    document.getElementById('s2').style.display='block';
    document.getElementById('s2').style.animation='fadeIn .5s ease';
    setTimeout(()=>document.getElementById('cta').classList.add('show'),800);
  },500);
}

function confetti(){
  const c=['#E8D48A','#D4AF50','#C49428','#F0E4A8','#FBF5D5','#B89030'];
  const w=document.getElementById('conf');
  for(let i=0;i<65;i++){
    const p=document.createElement('div');p.className='petal';
    const sz=4+Math.random()*7;
    p.style.cssText=`left:${Math.random()*100}vw;width:${sz}px;height:${sz*1.6}px;background:${c[~~(Math.random()*c.length)]};--d:${Math.random()*140-70}px;--r:${Math.random()*720-360}deg;animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*1}s;`;
    w.appendChild(p);
    setTimeout(()=>p.remove(),4000);
  }
}

// ── CLAVIER ──
document.addEventListener('keydown', e=>{
  if(e.code==='ArrowRight' || e.code==='Space' || e.code==='Enter') goNext();
  if(e.code==='ArrowLeft') goBack();
});

// ── SWIPE MOBILE ──
document.addEventListener('touchstart', e=>{
  touchStartX = e.touches[0].clientX;
  touchStartY = e.touches[0].clientY;
}, {passive:true});

document.addEventListener('touchend', e=>{
  const dx = e.changedTouches[0].clientX - touchStartX;
  const dy = e.changedTouches[0].clientY - touchStartY;
  if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40){
    if(dx < 0) goNext();   // swipe gauche → suivant
    else goBack();          // swipe droit → précédent
  }
}, {passive:true});

// ── BOUTONS NAV (flèches visuelles) ──
function showNavArrows(){
  document.getElementById('nav-prev').style.opacity = s>0 ? '1':'0';
  document.getElementById('nav-prev').style.pointerEvents = s>0 ? 'auto':'none';
  document.getElementById('nav-next').style.opacity = s<2 ? '1':'0';
  document.getElementById('nav-next').style.pointerEvents = s<2 ? 'auto':'none';
}
setInterval(showNavArrows, 100);
</script>

<style>
@keyframes fadeOut{from{opacity:1;}to{opacity:0;transform:translateY(-10px);}}
</style>
