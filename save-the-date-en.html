<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Raoine & Aboudé — Save the Date</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400&family=Cinzel:wght@400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:#EFE9DF;font-family:'Cormorant Garamond',serif;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;
  background-image:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(140,120,80,.025) 3px,rgba(140,120,80,.025) 4px),
    repeating-linear-gradient(90deg,transparent,transparent 3px,rgba(140,120,80,.025) 3px,rgba(140,120,80,.025) 4px);
  pointer-events:none;z-index:0;}

.scene{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.4rem;z-index:1;padding:1rem;}

.gif-wrap{
  position:relative;
  width:min(460px,88vw);
  border-radius:4px;
  box-shadow:0 30px 70px rgba(26,20,16,.18),0 8px 20px rgba(26,20,16,.1);
  overflow:hidden;
  cursor:pointer;
}
.gif-wrap img{width:100%;display:block;}

/* Progress bar */
.progress-bar{position:absolute;bottom:0;left:0;width:100%;height:3px;background:rgba(26,20,16,.12);}
.progress-fill{height:100%;background:linear-gradient(90deg,#C4980A,#E8D070);width:0%;animation:prog 32s linear forwards;}
@keyframes prog{from{width:0%;}to{width:100%;}}

/* CTA */
.cta-btn{
  display:inline-flex;align-items:center;gap:.65rem;
  background:#1A1410;color:#F8F3E8;
  font-family:'Cinzel',serif;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;
  padding:.9rem 2rem;border-radius:50px;text-decoration:none;
  box-shadow:0 8px 26px rgba(26,20,16,.26);
  transition:all .25s ease;
  animation:fadeUp 1.2s ease .8s both;
}
.cta-btn:hover{background:#3A3020;transform:translateY(-2px);}

.timer{
  font-style:italic;font-size:.8rem;color:#3A3020;opacity:.5;
  animation:fadeUp 1.2s ease 1s both;
}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
</style>
</head>
<body>
<div class="scene">
  <div class="gif-wrap" onclick="go()">
    <img src="Raoine-et-Aboude-gb.gif" alt="Save the Date — Raoine & Aboudé">
    <div class="progress-bar"><div class="progress-fill"></div></div>
  </div>
  <a class="cta-btn" href="index.html">💌 &nbsp;Confirm my attendance</a>
  <div class="timer" id="timer">Redirecting in 32 seconds…</div>
</div>
<script>
let r=32;
const el=document.getElementById('timer');
const iv=setInterval(()=>{
  r--;
  if(r<=0){clearInterval(iv);go();}
  else el.textContent=`Redirecting in ${r} second${r>1?'s':''}…`;
},1000);
function go(){window.location.href='index.html';}
</script>
</body>
</html>
